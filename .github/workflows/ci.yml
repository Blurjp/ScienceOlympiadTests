name: CI

on:
  push:
    branches: [main, master, claude/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test & Lint
    # CI_MAC_RUNNER repo variable flips this to ["self-hosted", "mac-mini"]
    # once the runner pair is online. Absent variable = hosted ubuntu, so
    # this workflow is behavior-neutral before the flip.
    runs-on: ${{ fromJSON(vars.CI_MAC_RUNNER || '"ubuntu-latest"') }}
    # Public repo: fork PRs must never run unreviewed code on the self-hosted
    # machine. PR-triggered runs wait for a reviewer in mac-ci-approval;
    # push runs (trusted committers) use the unprotected mac-ci-open.
    environment: ${{ github.event_name == 'pull_request' && 'mac-ci-approval' || 'mac-ci-open' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cache only on hosted runners: the self-hosted machine persists
          # node_modules on disk, and a multi-GB cache archive POST would
          # crawl on residential upload bandwidth. NB: the condition must be
          # written Linux-positive - in GitHub expressions '' is falsy, so
          # `os == 'macOS' && '' || 'npm'` would always evaluate to 'npm'.
          cache: ${{ runner.os == 'Linux' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ${{ fromJSON(vars.CI_MAC_RUNNER || '"ubuntu-latest"') }}
    environment: ${{ github.event_name == 'pull_request' && 'mac-ci-approval' || 'mac-ci-open' }}
    needs: test

    steps:
      # clean: false keeps .next/ build caches across runs on the
      # self-hosted machine (hosted runners start from a clean disk anyway,
      # so nothing changes there). npm ci still wipes node_modules by its
      # own semantics; that is fine.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ runner.os == 'Linux' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Provide dummy env vars for build
          AUTH_SECRET: build-secret-placeholder
          GOOGLE_CLIENT_ID: build-placeholder
          GOOGLE_CLIENT_SECRET: build-placeholder
          OPENAI_API_KEY: build-placeholder
          TURSO_DATABASE_URL: file:./build.db
          TURSO_AUTH_TOKEN: build-placeholder

  # This job ensures all required checks pass
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()

    steps:
      - name: Check if all jobs passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed!"
